<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--<link rel="stylesheet" href="css/style.css">-->
    <link rel="stylesheet" href="css/ai-style.css">
</head>
<body>

    <header>
        <nav>
            <a href="Home.html">HOME</a>
            <a href="AboutUs.html">ABOUT US</a>
            <a href="FAQs.html">FAQs</a>
            <a href="Contact.html">CONTACT US</a>
        </nav>

        <h1>The Artisan Left-Sock Emporium</h1>
        <p>Where mismatched pairs find their true calling.</p>
    </header>

    <main>
        <article class="contact-card">
            <header>
                <h2>Drop Us a Line (Or a Dryer Sheet)</h2>
                <p>Got a question? Want to confess that you've been wearing inside-out socks all week? Fill out the form below!</p>
            </header>
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="e.g., Jose Cruz" required>
            
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g., JoseCruz123@example.com" required>
            
                <label for="subject">Reason for Inquiry</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select a topic...</option>
                    <option value="missing-sock">My dryer ate my sock</option>
                    <option value="style-advice">Sock pairing advice</option>
                    <option value="lint-joke">I have a good lint joke</option>
                    <option value="other">Other existential query</option>
                </select> 

                <label for="message">Your Message</label>
                <textarea id="message" rows="5" placeholder="Tell us what's on your mind (or your feet)..." required></textarea>
        
                <button type="submit">Send Message</button>
            </form>

        </article>
    </main>   
        
</body>
</html>
